### 模型
model_name_or_path: /root/autodl-tmp/models/Qwen2.5-1.5B-Instruct
trust_remote_code: false

### 训练阶段
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
quantization_bit: 4
quantization_method: bitsandbytes
template: qwen

### 数据
dataset: stage0_tool_smoke
dataset_dir: /root/autodl-tmp/tool-use-posttraining/data
cutoff_len: 512
max_samples: 4
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 0

### 输出
output_dir: /root/autodl-tmp/tool-use-posttraining/checkpoints/stage0_qlora_smoke
logging_dir: /root/autodl-tmp/tool-use-posttraining/logs/stage0_qlora_smoke
logging_steps: 1
save_steps: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### 训练参数
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
max_steps: 2
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
seed: 42
